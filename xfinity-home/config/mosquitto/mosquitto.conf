# =============================================================================
# Mosquitto configuration - local smart home control plane
# =============================================================================
# Deployed by scripts/02-Setup-Mosquitto.ps1 to:
#   C:\ProgramData\xfinity-home\mosquitto\mosquitto.conf
#
# Design intent: this broker is the single message bus between the Zigbee
# network, the Z-Wave network, the camera layer and any dashboard. It is
# reachable on the LAN but never anonymous, and it is never exposed to the
# internet. Do not port-forward 1883 or 9001.
# =============================================================================

# Each listener carries its own auth settings. This must be set before any
# listener block, and it changes the scope of allow_anonymous / password_file
# from global to per-listener - they must then appear inside each block below.
per_listener_settings true

# -----------------------------------------------------------------------------
# Listener 1: native MQTT. Used by Zigbee2MQTT, Z-Wave JS UI and any native
# client. Bound to all interfaces so other machines on the LAN can subscribe;
# restrict with the Windows Firewall rule created by the setup script.
# -----------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file C:\ProgramData\xfinity-home\mosquitto\passwd

# -----------------------------------------------------------------------------
# Listener 2: MQTT over WebSockets. Browser-based dashboards cannot speak raw
# MQTT over TCP; they need this. Harmless to leave enabled if unused.
# -----------------------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file C:\ProgramData\xfinity-home\mosquitto\passwd

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------
# Retained messages and queued QoS 1/2 messages survive a broker restart or a
# host reboot. Without this, every retained device state is lost on restart and
# dashboards come up blank until each device next reports - which for a
# battery-powered contact sensor can be hours.
persistence true
persistence_location C:\ProgramData\xfinity-home\mosquitto\
autosave_interval 1800

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_dest file C:\ProgramData\xfinity-home\mosquitto\mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
# Uncomment while debugging a client that will not connect or subscribe.
# Very noisy on a live network - do not leave enabled.
# log_type information
# log_type debug

# -----------------------------------------------------------------------------
# Limits
# -----------------------------------------------------------------------------
# Headroom for a burst of retained messages when Zigbee2MQTT republishes its
# full device list on startup.
max_queued_messages 10000

# Zigbee2MQTT publishes a bridge/devices payload that grows with device count
# and can exceed the 1 MB default on a large network with many exposes.
message_size_limit 16384000

# Drop clients that stop responding, so a crashed service does not hold a
# session open and silently swallow retained state.
keepalive_interval 60
